name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    outputs:
      artifact-path: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          tag=${GITHUB_REF##*/}
          out=release/tracker-${GOOS}-${GOARCH}-${tag}
          mkdir -p release
          echo "Building ${out}..."
          go build -ldflags="-s -w" -o "$out" ./cmd/tui
          chmod +x "$out" || true
          ls -lh "$out"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-${{ matrix.os }}-${{ matrix.arch }}
          path: release/tracker-${{ matrix.os }}-${{ matrix.arch }}-${{ github.ref_name }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List release files
        run: ls -lah release

      - name: Create Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: release/*
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false